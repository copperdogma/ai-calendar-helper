# Image event extraction eval – updated to promptfoo v0.115 schema
providers:
  # Local custom provider that wraps OpenAI Responses API and always returns JSON object
  - id: openai:responses:gpt-4.1-nano

# Custom binary scorer for JSON validity remains under scorers
scorers:
  - path: ./scorers/image-json-valid.js
  - path: ./scorers/description-similarity-threshold.js

# Nunjucks filters for templating
nunjucksFilters:
  base64: ./helpers/base64.js
  dataUrl: ./helpers/base64.js

# Numeric metric for description similarity
metrics:
  descriptionSimilarity:
    path: ./scorers/description-similarity.js

prompts:
  - file://prompts/extract-image-event.js

tests:
  path: ./fixtures/image-events-dataset.jsonl

defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: (output && typeof output === 'object' && output.description && output.description.trim().length >= 10)
  options:
    transformVars: file://helpers/upload-image-file.js
    transform: |
      /* Normalize the assistant response so assertions always receive a plain JS object.
         Handles several variants:
         1. The provider already returned a JSON object (desired).
         2. The provider returned { output_text: '{...}' }.
         3. The provider returned a raw string with or without ``` fences.
      */

      // Case 1 – already an object
      if (output && typeof output === 'object' && !Array.isArray(output)) {
        if (output.title || output.output_text === undefined) {
          return output;
        }
        // Case 2 – object wrapper with output_text string
        if (typeof output.output_text === 'string') {
          let txt = output.output_text.trim();
          if (txt.startsWith('```')) {
            txt = txt.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '').trim();
          }
          try {
            return JSON.parse(txt);
          } catch (_) {
            return txt;
          }
        }
      }

      // Case 3 – plain string
      if (typeof output === 'string') {
        let txt = output.trim();
        if (txt.startsWith('```')) {
          txt = txt.replace(/^```[a-zA-Z]*\s*/, '').replace(/```\s*$/, '').trim();
        }
        try {
          return JSON.parse(txt);
        } catch (_) {
          return txt;
        }
      }

      return output;

      // Final fallback
      if (output == null) {
        return {};
      }
